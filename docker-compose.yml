# ============================================================
# docker-compose.yml : décrit TOUS les conteneurs du projet.
# "docker compose up -d"  -> démarre tout
# "docker compose down"   -> arrête tout
# Chaque entrée sous "services:" est un conteneur.
# ============================================================

services:

  # ----------------------------------------------------------
  # PHP : fait tourner Laravel (l'API)
  # ----------------------------------------------------------
  php:
    # Construit l'image avec le fichier "Dockerfile" de ce dossier
    build: .

    # Relie le dossier ./backend (sur ton ordinateur) au dossier
    # /var/www/html (dans le conteneur). Tu modifies le code avec
    # ton éditeur, le conteneur le voit tout de suite.
    volumes:
      - ./backend:/var/www/html

    # Variables d'environnement vues par Laravel.
    # Elles passent AVANT le fichier backend/.env :
    # tu n'as donc rien à modifier dans le .env de Laravel.
    # "&laravel-env" est une étiquette : on la réutilise plus bas
    # avec "*laravel-env" pour ne pas tout réécrire.
    environment: &laravel-env
      APP_URL: http://localhost:8000          # adresse de l'API
      FRONTEND_URL: http://localhost:5173     # adresse du front React

      # Base de données : "mysql" est le NOM du service plus bas.
      # (À l'intérieur d'un conteneur, "localhost" ne marcherait pas.)
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: collectif
      DB_USERNAME: collectif
      DB_PASSWORD: secret

      # Redis : stocke le cache, les sessions et la file d'attente
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      # Emails : envoyés vers Mailpit (boîte mail de test),
      # donc rien ne part vraiment sur Internet.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@collectif.test
      MAIL_FROM_NAME: Collectif

      # Sanctum (connexion par cookie entre React et Laravel) :
      # liste des sites autorisés à se connecter à l'API.
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
      SESSION_DOMAIN: localhost

    # Démarre mysql et redis avant php
    # (attention : il attend leur démarrage, pas qu'ils soient prêts)
    depends_on:
      - mysql
      - redis

  # ----------------------------------------------------------
  # NGINX : le serveur web, il reçoit les requêtes du navigateur
  # et les passe à PHP. Voir le fichier nginx.conf.
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine      # image toute faite, pas de Dockerfile
    ports:
      - "8000:80"                 # gauche = ton PC, droite = le conteneur
                                  # -> http://localhost:8000
    volumes:
      - ./backend:/var/www/html   # il doit voir le dossier public/ de Laravel
      - ./nginx.conf:/etc/nginx/conf.d/default.conf   # notre configuration
    depends_on:
      - php

  # ----------------------------------------------------------
  # QUEUE : traite les tâches en arrière-plan.
  # Exemple : envoyer 30 emails sans faire attendre l'utilisateur.
  # ----------------------------------------------------------
  queue:
    build: .                      # même image que php
    # Autre commande au démarrage : écoute la file d'attente.
    # "queue:listen" recharge le code à chaque tâche (pratique en dev).
    command: php artisan queue:listen --tries=3
    volumes:
      - ./backend:/var/www/html
    environment: *laravel-env     # réutilise les variables de php
    depends_on:
      - php
    restart: unless-stopped       # redémarre tout seul s'il plante

  # ----------------------------------------------------------
  # SCHEDULER : exécute les tâches planifiées de Laravel
  # (ex : rappel la veille d'un événement).
  # ----------------------------------------------------------
  scheduler:
    build: .
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment: *laravel-env
    depends_on:
      - php
    restart: unless-stopped

  # ----------------------------------------------------------
  # MYSQL : la base de données (événements, utilisateurs...)
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    environment:
      # Ces valeurs créent la base et l'utilisateur au 1er démarrage.
      # Elles doivent être les mêmes que DB_* plus haut.
      MYSQL_DATABASE: collectif
      MYSQL_USER: collectif
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"               # pour t'y connecter avec DBeaver / TablePlus
    volumes:
      # Volume nommé (voir "volumes:" tout en bas) : la base survit
      # même si tu supprimes le conteneur.
      - mysql-data:/var/lib/mysql

  # ----------------------------------------------------------
  # REDIS : mémoire rapide (cache, sessions, file d'attente)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine

  # ----------------------------------------------------------
  # MAILPIT : fausse boîte mail pour tester les emails
  # ----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"               # interface web : http://localhost:8025
      - "1025:1025"               # port SMTP (utilisé par Laravel)

  # ----------------------------------------------------------
  # FRONTEND : React + Vite
  # ----------------------------------------------------------
  frontend:
    image: node:22-alpine         # Node suffit, pas besoin de Dockerfile
    working_dir: /app             # dossier où s'exécute la commande
    # Installe les dépendances puis lance Vite.
    # "--host 0.0.0.0" est OBLIGATOIRE : sans ça, Vite n'écoute qu'à
    # l'intérieur du conteneur et ton navigateur ne peut pas y accéder.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"               # -> http://localhost:5173
    volumes:
      - ./frontend:/app
      # Garde node_modules dans un volume Docker pour ne pas
      # le mélanger avec ton dossier.
      - node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000   # adresse de l'API pour React

# Déclaration des volumes nommés (gérés par Docker)
volumes:
  mysql-data:
  node-modules: