# ============================================================
# nginx.conf : explique à Nginx quoi faire avec chaque requête.
# Chemin d'une requête :
#   Navigateur -> Nginx (port 80 du conteneur) -> PHP-FPM -> Laravel
# ============================================================

server {
    # Nginx écoute sur le port 80 dans son conteneur
    # (le compose le publie sur http://localhost:8000)
    listen 80;

    # Taille maximale d'une requête (pour les photos envoyées)
    client_max_body_size 12M;

    # Dossier servi : "public" de Laravel.
    # Le reste du projet (.env, app/, config/...) n'est jamais
    # accessible depuis Internet : c'est une règle de sécurité.
    root /var/www/html/public;

    # Fichier ouvert par défaut
    index index.php;

    # --- Règle 1 : toutes les URL ---
    location / {
        # Essaie dans l'ordre :
        #   1) un vrai fichier à cette URL (image, css...) -> $uri
        #   2) un vrai dossier -> $uri/
        #   3) sinon, envoie tout à index.php : Laravel lit l'URL
        #      (/api/events...) et choisit la bonne route.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Règle 2 : les fichiers PHP ---
    location ~ \.php$ {
        # Passe la requête à PHP-FPM. "php" est le nom du service
        # dans docker-compose.yml, 9000 le port de PHP-FPM.
        fastcgi_pass php:9000;

        # Paramètres standards fournis par Nginx
        include fastcgi_params;

        # Indique à PHP-FPM quel fichier exécuter.
        # Sans cette ligne : erreur "File not found".
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}